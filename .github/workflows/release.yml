name: Release

# Publishes a GitHub release for a version tag, with that version's notes from
# CHANGELOG.md. Pushing a tag (git push origin v1.0.0) releases it. "Run workflow" in the
# Actions tab releases every tag that has no release yet: GitHub sends no push event when
# more than three tags are pushed at once.
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      # the tag that triggered the run arrives without its annotation; fetch them all
      - run: git fetch --force --tags
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
      - name: Publish the releases
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT: ${{ github.event_name }}
          TAG: ${{ github.ref_name }}
        run: |
          if [ "$EVENT" = "push" ]; then
            node scripts/release.mjs "$TAG"
          else
            node scripts/release.mjs --all
          fi
