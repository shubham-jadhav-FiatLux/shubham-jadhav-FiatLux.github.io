name: Feature idea
description: Suggest something new for the valley
labels: [enhancement]
body:
  - type: textarea
    id: idea
    attributes:
      label: The idea
      description: What would you like to see or do in the valley?
    validations:
      required: true
  - type: textarea
    id: why
    attributes:
      label: Why it would be delightful or useful
    validations:
      required: true
  - type: textarea
    id: reference
    attributes:
      label: Sketch or reference
      description: Optional. A drawing, a screenshot or a link to something similar.
