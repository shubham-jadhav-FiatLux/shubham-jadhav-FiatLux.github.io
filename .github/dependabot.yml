# Keeps the npm packages and the GitHub Actions up to date, one grouped pull request a
# month for minor and patch releases; major releases come one by one.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 5
    groups:
      minor-and-patch:
        patterns: ['*']
        update-types: [minor, patch]
    ignore:
      # @types/node follows the Node version the site is built with (.nvmrc), not the latest
      - dependency-name: '@types/node'
        update-types: ['version-update:semver-major']
      # TypeScript 7 waits until typescript-eslint supports it (npm ci fails on the peer range)
      - dependency-name: 'typescript'
        update-types: ['version-update:semver-major']
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    groups:
      actions:
        patterns: ['*']
